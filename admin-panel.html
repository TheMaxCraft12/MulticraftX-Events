<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel – Minecraft Events</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🔐 EVENT ADMIN</div>

    <nav>
        <a href="index.html">Website</a>
        <a href="#" id="logout">Abmelden</a>
    </nav>
</header>


<main>

    <!-- EVENT EINSTELLUNGEN -->

    <section class="section">

        <h2>⚙️ Event-Einstellungen</h2>

        <div class="registration">

            <form id="event-form">

                <label for="event-title-input">
                    Event-Titel
                </label>

                <input
                    type="text"
                    id="event-title-input"
                    required
                >

                <label for="event-description-input">
                    Beschreibung
                </label>

                <input
                    type="text"
                    id="event-description-input"
                >

                <label for="event-date-input">
                    Datum
                </label>

                <input
                    type="date"
                    id="event-date-input"
                    required
                >

                <label for="event-time-input">
                    Uhrzeit
                </label>

                <input
                    type="time"
                    id="event-time-input"
                    required
                >

                <label for="event-location-input">
                    Bereich / Ort
                </label>

                <input
                    type="text"
                    id="event-location-input"
                    required
                >

                <label for="event-server-input">
                    Server-IP
                </label>

                <input
                    type="text"
                    id="event-server-input"
                    required
                >

                <label for="max-participants-input">
                    Maximale Teilnehmer
                </label>

                <input
                    type="number"
                    id="max-participants-input"
                    min="1"
                    max="1000"
                    required
                >

                <button type="submit">
                    💾 Event speichern
                </button>

            </form>

            <br>

            <button id="toggle-registration">
                🔓 Anmeldung wird geladen...
            </button>

        </div>

    </section>


    <!-- TEILNEHMER -->

    <section class="section">

        <h2>🏁 Teilnehmer</h2>

        <div class="registration">

            <h3>
                Teilnehmer:
                <span id="participant-count">0</span>
                /
                <span id="max-participants-display">20</span>
            </h3>

            <div id="participants">
                Wird geladen...
            </div>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://hdbgpedywtsiazbawbao.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Ab0ub7SN99UIjDdXCdSNNw_4FSlDmDa";


const supabaseDB =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ========================================
// ADMIN PRÜFEN
// ========================================

async function checkAdmin() {

    const { data, error } =
        await supabaseDB.auth.getUser();

    if (error || !data.user) {

        window.location.href = "admin.html";

        return;
    }

    loadEventSettings();
    loadParticipants();
}


// ========================================
// EVENT-DATEN LADEN
// ========================================

async function loadEventSettings() {

    const { data, error } =
        await supabaseDB
            .from("event_settings")
            .select("*")
            .eq("id", 1)
            .single();


    if (error) {

        console.error(
            "Fehler beim Laden des Events:",
            error
        );

        return;
    }


    document.getElementById("event-title-input").value =
        data.title || "";

    document.getElementById("event-description-input").value =
        data.description || "";

    document.getElementById("event-date-input").value =
        data.event_date || "";

    document.getElementById("event-time-input").value =
        data.event_time
            ? data.event_time.substring(0, 5)
            : "";

    document.getElementById("event-location-input").value =
        data.location || "";

    document.getElementById("event-server-input").value =
        data.server_ip || "";

    document.getElementById("max-participants-input").value =
        data.max_participants || 20;

    updateRegistrationButton(
        data.registration_open
    );
}


// ========================================
// EVENT SPEICHERN
// ========================================

document
    .getElementById("event-form")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const title =
            document.getElementById("event-title-input").value.trim();

        const description =
            document.getElementById("event-description-input").value.trim();

        const eventDate =
            document.getElementById("event-date-input").value;

        const eventTime =
            document.getElementById("event-time-input").value;

        const location =
            document.getElementById("event-location-input").value.trim();

        const serverIP =
            document.getElementById("event-server-input").value.trim();

        const maxParticipants =
            Number(
                document.getElementById("max-participants-input").value
            );


        const { error } =
            await supabaseDB
                .from("event_settings")
                .update({
                    title: title,
                    description: description,
                    event_date: eventDate,
                    event_time: eventTime,
                    location: location,
                    server_ip: serverIP,
                    max_participants: maxParticipants
                })
                .eq("id", 1);


        if (error) {

            console.error(error);

            alert(
                "❌ Event konnte nicht gespeichert werden:\n" +
                error.message
            );

            return;
        }


        alert("✅ Event wurde gespeichert!");

        loadEventSettings();

    });


// ========================================
// ANMELDUNG ÖFFNEN / SCHLIESSEN
// ========================================

const toggleButton =
    document.getElementById("toggle-registration");


toggleButton.addEventListener("click", async function() {

    const { data, error } =
        await supabaseDB
            .from("event_settings")
            .select("registration_open")
            .eq("id", 1)
            .single();


    if (error) {

        alert("❌ Status konnte nicht geladen werden.");

        return;
    }


    const newStatus =
        !data.registration_open;


    const { error: updateError } =
        await supabaseDB
            .from("event_settings")
            .update({
                registration_open: newStatus
            })
            .eq("id", 1);


    if (updateError) {

        alert(
            "❌ Status konnte nicht geändert werden:\n" +
            updateError.message
        );

        return;
    }


    updateRegistrationButton(newStatus);

    alert(
        newStatus
            ? "🔓 Anmeldung geöffnet!"
            : "🔒 Anmeldung geschlossen!"
    );

});


function updateRegistrationButton(isOpen) {

    toggleButton.textContent =
        isOpen
            ? "🔓 Anmeldung geöffnet – schließen"
            : "🔒 Anmeldung geschlossen – öffnen";
}


// ========================================
// TEILNEHMER LADEN
// ========================================

async function loadParticipants() {

    const { data, error } =
        await supabaseDB
            .from("anmeldungen")
            .select("*")
            .order("id", { ascending: true });


    if (error) {

        console.error(error);

        document.getElementById("participants").textContent =
            "Fehler beim Laden der Teilnehmer.";

        return;
    }


    document.getElementById("participant-count")
        .textContent = data.length;


    const eventResult =
        await supabaseDB
            .from("event_settings")
            .select("max_participants")
            .eq("id", 1)
            .single();


    if (!eventResult.error) {

        document.getElementById(
            "max-participants-display"
        ).textContent =
            eventResult.data.max_participants;
    }


    const container =
        document.getElementById("participants");


    container.innerHTML = "";


    if (data.length === 0) {

        container.textContent =
            "Noch keine Teilnehmer.";

        return;
    }


    data.forEach(function(participant) {

        const row =
            document.createElement("div");


        row.style.padding = "15px";
        row.style.marginTop = "10px";
        row.style.background = "#202020";
        row.style.borderRadius = "6px";


        row.innerHTML = `
            <strong>
                ${participant.minecraft_name}
            </strong>

            <br>

            Discord:
            ${participant.discord_name}

            <br><br>

            <button
                onclick="deleteParticipant('${participant.id}')"
            >
                🗑️ Löschen
            </button>
        `;


        container.appendChild(row);

    });

}


// ========================================
// TEILNEHMER LÖSCHEN
// ========================================

async function deleteParticipant(id) {

    if (
        !confirm(
            "Diesen Teilnehmer wirklich löschen?"
        )
    ) {

        return;
    }


    const { error } =
        await supabaseDB
            .from("anmeldungen")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "❌ Löschen fehlgeschlagen:\n" +
            error.message
        );

        return;
    }


    loadParticipants();

}


// ========================================
// LOGOUT
// ========================================

document
    .getElementById("logout")
    .addEventListener("click", async function(event) {

        event.preventDefault();

        await supabaseDB.auth.signOut();

        window.location.href = "admin.html";

    });


// ========================================
// START
// ========================================

checkAdmin();

</script>

</body>
</html>
