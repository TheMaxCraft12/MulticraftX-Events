<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin – Minecraft Events</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🔐 EVENT ADMIN</div>

    <nav>
        <a href="index.html">Website</a>
        <a href="#" id="logout">Abmelden</a>
    </nav>
</header>


<main>

<section class="section">

    <h2>🏁 Event-Verwaltung</h2>

    <div class="registration">

        <button id="new-event">
            ➕ Neues Event
        </button>

        <div id="events-list">
            Wird geladen...
        </div>

    </div>

</section>


<section class="section" id="editor-section" style="display:none;">

    <h2>✏️ Event bearbeiten</h2>

    <div class="registration">

        <form id="event-form">

            <input type="hidden" id="event-id">

            <label>Event-Titel</label>

            <input
                type="text"
                id="event-title"
                required
            >


            <label>Beschreibung</label>

            <input
                type="text"
                id="event-description"
            >

            <label>Event-Kategorie</label>

<select id="event-category" required>
   <label>
    <input
        type="checkbox"
        id="voting-enabled"
        checked
    >
    🗳️ Voting aktivieren
</label>

<br>

<label>
    <input
        type="checkbox"
        id="racing-companies-enabled"
    >
    🏎️ Rennfirmen aktivieren
</label>
    <option value="rennen">🏎️ Rennen</option>
    <option value="bau">🏗️ Bau-Event</option>
    <option value="pvp">⚔️ PvP</option>
    <option value="minigame">🎮 Minigame</option>
    <option value="challenge">🎯 Challenge</option>
    <option value="turnier">🏆 Turnier</option>
    <option value="community">🎉 Community</option>
    <option value="sonstiges" selected>❓ Sonstiges</option>
</select>

            <label>Datum</label>

            <input
                type="date"
                id="event-date"
                required
            >


            <label>Uhrzeit</label>

            <input
                type="time"
                id="event-time"
                required
            >


            <label>Bereich / Ort</label>

            <input
                type="text"
                id="event-location"
            >


            <label>Server-IP</label>

            <input
                type="text"
                id="event-server"
            >


            <label>Maximale Teilnehmer</label>

            <input
                type="number"
                id="event-max"
                min="1"
                max="1000"
                value="20"
                required
            >


            <button type="submit">
                💾 Speichern
            </button>

            <button
                type="button"
                id="cancel-edit"
            >
                ❌ Abbrechen
            </button>

        </form>

    </div>

</section>


<section class="section">

    <h2>👥 Teilnehmer</h2>

    <div class="registration">

        <h3 id="selected-event-name">
            Kein Event ausgewählt
        </h3>

        <p>
            Teilnehmer:
            <strong id="participant-count">0</strong>
            /
            <strong id="participant-max">0</strong>
        </p>

        <div id="participants">
            Wähle ein Event aus.
        </div>

    </div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://hdbgpedywtsiazbawbao.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Ab0ub7SN99UIjDdXCdSNNw_4FSlDmDa";


const supabaseDB =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let selectedEventId = null;


// ========================================
// ADMIN PRÜFEN
// ========================================

async function checkAdmin() {

    const { data } =
        await supabaseDB.auth.getUser();

    if (!data.user) {

        window.location.href = "admin.html";

        return;
    }

    loadEvents();
}


// ========================================
// EVENTS LADEN
// ========================================

async function loadEvents() {

    const { data, error } =
        await supabaseDB
            .from("events")
            .select("*")
            .order("event_date", {
                ascending: true
            });


    if (error) {

        console.error(error);

        document.getElementById("events-list")
            .textContent =
            "Fehler beim Laden der Events.";

        return;
    }


    const container =
        document.getElementById("events-list");


    container.innerHTML = "";


    if (data.length === 0) {

        container.textContent =
            "Noch keine Events.";

        return;
    }


    data.forEach(event => {

        const box =
            document.createElement("div");


        box.style.padding = "20px";
        box.style.marginTop = "15px";
        box.style.background = "#202020";
        box.style.borderRadius = "8px";


        box.innerHTML = `

            <h3>📅 ${event.title}</h3>

            <p>
                Kategorie:
                ${event.category || "sonstiges"}
            </p>

            <p>
                📅 ${event.event_date}
                •
                🕝 ${event.event_time.substring(0,5)}
            </p>

            <p>
                🌎 ${event.location || ""}
            </p>

            <br>

            <button
                onclick="editEvent(${event.id})"
            >
                ✏️ Bearbeiten
            </button>

            <button
                onclick="selectEvent(${event.id})"
            >
                👥 Teilnehmer
            </button>

            <button
                onclick="deleteEvent(${event.id})"
            >
                🗑️ Löschen
            </button>

        `;


        container.appendChild(box);

    });

}


// ========================================
// NEUES EVENT
// ========================================

document
    .getElementById("new-event")
    .addEventListener("click", function() {

        selectedEventId = null;

        document.getElementById("event-form")
            .reset();

        document.getElementById("event-id")
            .value = "";

        document.getElementById("editor-section")
            .style.display = "block";

        window.scrollTo({
            top: document.getElementById(
                "editor-section"
            ).offsetTop - 80,

            behavior: "smooth"
        });

    });


// ========================================
// EVENT BEARBEITEN
// ========================================

async function editEvent(id) {

    const { data, error } =
        await supabaseDB
            .from("events")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        alert(
            "❌ Event konnte nicht geladen werden."
        );

        return;
    }


    document.getElementById("event-id")
        .value = data.id;

    document.getElementById("event-title")
        .value = data.title;

    document.getElementById("event-description")
        .value = data.description || "";

    document.getElementById("event-category")
    .value = data.category || "sonstiges";

    document.getElementById("voting-enabled")
    .checked = data.voting_enabled ?? true;

    document.getElementById("racing-companies-enabled")
    .checked = data.racing_companies_enabled ?? false;
    
    document.getElementById("event-date")
        .value = data.event_date;

    document.getElementById("event-time")
        .value = data.event_time.substring(0,5);

    document.getElementById("event-location")
        .value = data.location || "";

    document.getElementById("event-server")
        .value = data.server_ip || "";

    document.getElementById("event-max")
        .value = data.max_participants;


    document.getElementById("editor-section")
        .style.display = "block";


    window.scrollTo({
        top: document.getElementById(
            "editor-section"
        ).offsetTop - 80,

        behavior: "smooth"
    });

}


// ========================================
// EVENT SPEICHERN
// ========================================

document
    .getElementById("event-form")
    .addEventListener("submit", async function(e) {

        e.preventDefault();


        const id =
            document.getElementById("event-id")
                .value;


        const eventData = {

            title:
                document.getElementById(
                    "event-title"
                ).value.trim(),

            description:
                document.getElementById(
                    "event-description"
                ).value.trim(),

            category:
                document.getElementById(
                    "event-category"
                ).value,

            voting_enabled:
                document.getElementById(
                    "voting-enabled"
                ).checked,

            racing_companies_enabled:
                document.getElementById(
                    "racing-companies-enabled"
                ).checked,
            
            event_date:
                document.getElementById(
                    "event-date"
                ).value,

            event_time:
                document.getElementById(
                    "event-time"
                ).value,

            location:
                document.getElementById(
                    "event-location"
                ).value.trim(),

            server_ip:
                document.getElementById(
                    "event-server"
                ).value.trim(),

            max_participants:
                Number(
                    document.getElementById(
                        "event-max"
                    ).value
                )
        };


        let result;


        if (id) {

            result =
                await supabaseDB
                    .from("events")
                    .update(eventData)
                    .eq("id", id);

        } else {

            result =
                await supabaseDB
                    .from("events")
                    .insert([eventData]);

        }


        if (result.error) {

            console.error(result.error);

            alert(
                "❌ Fehler:\n" +
                result.error.message
            );

            return;
        }


        alert("✅ Event gespeichert!");

        document.getElementById("editor-section")
            .style.display = "none";

        loadEvents();

    });


// ========================================
// EVENT LÖSCHEN
// ========================================

async function deleteEvent(id) {

    if (
        !confirm(
            "Event wirklich löschen?"
        )
    ) {
        return;
    }


    const { error } =
        await supabaseDB
            .from("events")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "❌ Event konnte nicht gelöscht werden:\n" +
            error.message
        );

        return;
    }


    alert("🗑️ Event gelöscht!");

    document.getElementById(
        "participants"
    ).textContent =
        "Wähle ein Event aus.";

    loadEvents();

}


// ========================================
// EVENT AUSWÄHLEN
// ========================================

async function selectEvent(id) {

    selectedEventId = id;


    const { data: event, error } =
        await supabaseDB
            .from("events")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        console.error(error);

        return;
    }


    document.getElementById(
        "selected-event-name"
    ).textContent =
        "🏁 " + event.title;


    document.getElementById(
        "participant-max"
    ).textContent =
        event.max_participants;


    const result =
        await supabaseDB
            .from("anmeldungen")
            .select("*")
            .eq("event_id", id)
            .order("id", {
                ascending: true
            });


    if (result.error) {

        console.error(result.error);

        return;
    }


    document.getElementById(
        "participant-count"
    ).textContent =
        result.data.length;


    const container =
        document.getElementById(
            "participants"
        );


    container.innerHTML = "";


    if (result.data.length === 0) {

        container.textContent =
            "Noch keine Teilnehmer.";

        return;
    }


    result.data.forEach(participant => {

        const row =
            document.createElement("div");


        row.style.padding = "15px";
        row.style.marginTop = "10px";
        row.style.background = "#202020";
        row.style.borderRadius = "6px";


        row.innerHTML = `

            <strong>
                ${participant.minecraft_name}
            </strong>

            <br>

            Discord:
            ${participant.discord_name}

            <br><br>

            <button
                onclick="deleteParticipant(${participant.id})"
            >
                🗑️ Löschen
            </button>

        `;


        container.appendChild(row);

    });

}


// ========================================
// TEILNEHMER LÖSCHEN
// ========================================

async function deleteParticipant(id) {

    if (
        !confirm(
            "Teilnehmer wirklich löschen?"
        )
    ) {
        return;
    }


    const { error } =
        await supabaseDB
            .from("anmeldungen")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "❌ Löschen fehlgeschlagen:\n" +
            error.message
        );

        return;
    }


    selectEvent(selectedEventId);

}


// ========================================
// ABBRECHEN
// ========================================

document
    .getElementById("cancel-edit")
    .addEventListener("click", function() {

        document.getElementById(
            "editor-section"
        ).style.display = "none";

    });


// ========================================
// LOGOUT
// ========================================

document
    .getElementById("logout")
    .addEventListener("click", async function(e) {

        e.preventDefault();

        await supabaseDB.auth.signOut();

        window.location.href = "admin.html";

    });


// START

checkAdmin();

</script>

</body>
</html>
